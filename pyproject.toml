[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-classifier"
version = "1.0.0"
description = "Resume classification system built on classical NLP and machine learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "scikit-learn>=1.6,<2.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "joblib>=1.4,<2.0",
    "pypdf>=5.1,<7.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "waitress>=3.0,<4.0",
]

[project.optional-dependencies]
train = [
    "pandas>=2.2,<4.0",
    "matplotlib>=3.8,<4.0",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<0.15",
    "mypy>=1.10,<2.0",
]

[project.scripts]
rc-build-dataset = "resume_classifier.cli:build_dataset_main"
rc-build-taxonomy = "resume_classifier.cli:build_taxonomy_main"
rc-train = "resume_classifier.cli:train_main"
rc-serve = "resume_classifier.cli:serve_main"
rc-info = "resume_classifier.cli:info_main"
rc-classify = "resume_classifier.cli:classify_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resume_classifier = ["py.typed", "api/templates/*.html"]

# ---------------------------------------------------------------------------
# Linting / formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]

# ---------------------------------------------------------------------------
# Static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "scipy.*",
    "pandas.*",
    "matplotlib.*",
    "joblib.*",
    "pypdf.*",
    "waitress.*",
    "alembic.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests that take more than a second",
    "requires_corpus: needs the built dataset in data/processed",
    "requires_model: needs a trained model in models/",
    "requires_db: needs a reachable PostgreSQL instance",
]

[tool.coverage.run]
source = ["src/resume_classifier"]
branch = true

[tool.coverage.report]
show_missing = true
