# Resume classification taxonomy -- version 1
#
# Closed, version-controlled class list. Every raw label found in a source
# corpus must map to exactly one canonical class here, or the dataset build
# fails. There is deliberately no catch-all "other" class: a heterogeneous
# bucket has no coherent decision boundary and degrades a linear model.
#
# Canonical ids are snake_case, stable, and never reused. Changing an id is a
# taxonomy version bump, not an edit.
#
# Derived from the label set of the LiveCareer resume corpus
# (data/raw/livecareer_resumes/v1). These are *industry* categories, not job
# titles: the corpus does not distinguish "Java Developer" from "DevOps
# Engineer" -- both are INFORMATION-TECHNOLOGY.

taxonomy_version = 1
description = "Industry-level professional categories for resume classification."

[[classes]]
id = "accountant"
display = "Accountant"
description = "Bookkeeping, financial reporting, audit, tax preparation."
source_labels = ["ACCOUNTANT"]

