# Skill taxonomy -- version 1
#
# Deterministic, controlled vocabulary for skill extraction. No model, no
# inference, no external service: a skill is present iff one of its aliases
# matches the normalised resume text.
#
# Curation method (reproducible):
#   1. Mine discriminative unigrams and bigrams from the TRAIN split only
#      (never validation or test -- mining the full corpus would leak test
#      vocabulary into a feature the model can see).
#   2. Keep terms that name a transferable, checkable capability: a tool, a
#      technology, a technique, a certification, a professional method.
#   3. Discard job titles, employer names, and generic filler.
#   4. Group surface forms under one canonical id via `aliases`.
#
# Because the corpus spans 24 industries, this taxonomy is deliberately
# multi-domain. An IT-only skill list would return nothing for two thirds of it.
#
# Aliases are matched against text that has already been through
# `feature_normalize`, so they must be written in that form: lower case, with
# "+", "#", "." and "-" preserved ("c++", "c#", "node.js", "back-end").

taxonomy_version = 1
description = "Multi-domain professional and technical skill vocabulary."

